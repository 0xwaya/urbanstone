name: Lead Sourcer

# Scheduled runner for lead-sourcer/. Replaces the removed Vercel cron (which
# had no runner to call) and the old laptop cron.
#
# Safe by default: runs in review-only mode (scan + log, no email/webhook)
# until the repo variable LEAD_SOURCER_MODE is set to "live".
# The sourcer never contacts the authors of posts.

on:
  schedule:
    # 8 AM, 12 PM, 5 PM America/New_York. Cron is UTC, so both DST variants are
    # listed; src/schedule-guard.js runs only the line that matches ET today.
    - cron: '0 12 * * *'   # 8 AM EDT
    - cron: '0 13 * * *'   # 8 AM EST
    - cron: '0 16 * * *'   # 12 PM EDT
    - cron: '0 17 * * *'   # 12 PM EST
    - cron: '0 21 * * *'   # 5 PM EDT
    - cron: '0 22 * * *'   # 5 PM EST
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode (review-only | dry-run | live). Blank = repo variable or review-only.'
        required: false
        default: ''
      force:
        description: 'One-off: skip the live cooldown for this manual run.'
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - 'lead-sourcer/**'
      - '.github/workflows/lead-sourcer.yml'

concurrency:
  group: lead-sourcer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lead-sourcer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lead-sourcer/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand

  run:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lead-sourcer
    env:
      LEAD_SOURCER_MODE: ${{ inputs.mode || vars.LEAD_SOURCER_MODE || 'review-only' }}
      # Sources stay off until their credentials exist (set the repo variable to "true").
      LEAD_SOURCER_ENABLE_REDDIT: ${{ vars.LEAD_SOURCER_ENABLE_REDDIT || 'false' }}
      LEAD_SOURCER_ENABLE_CRAIGSLIST: ${{ vars.LEAD_SOURCER_ENABLE_CRAIGSLIST || 'true' }}
      LEAD_SOURCER_ENABLE_APIFY: ${{ vars.LEAD_SOURCER_ENABLE_APIFY || 'false' }}
      LEAD_SOURCER_ENABLE_PERMITS: ${{ vars.LEAD_SOURCER_ENABLE_PERMITS || 'false' }}
      LEAD_SOURCER_ENABLE_PERMITS_HAMILTON: ${{ vars.LEAD_SOURCER_ENABLE_PERMITS_HAMILTON || 'false' }}
      LEAD_SOURCER_ENABLE_PERMITS_BUTLER: ${{ vars.LEAD_SOURCER_ENABLE_PERMITS_BUTLER || 'false' }}
      LEAD_SOURCER_SCHEDULE_CRON: ${{ github.event.schedule }}
      LEAD_SOURCER_SCHEDULE_HOURS_ET: ${{ vars.LEAD_SOURCER_SCHEDULE_HOURS_ET || '8,12,17' }}
      LEAD_SOURCER_COOLDOWN_HOURS: ${{ vars.LEAD_SOURCER_COOLDOWN_HOURS || '3' }}
      LEAD_SOURCER_FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
      LEAD_SOURCER_TRACING_ENABLED: 'false'
      LEAD_SOURCER_WEBHOOK_SECONDARY: 'false'
      LEAD_SOURCER_ALERT_EMAIL: ${{ vars.LEAD_SOURCER_ALERT_EMAIL || 'sales@urbanstone.co' }}
      LEAD_SOURCER_RUN_REPORT_EMAIL: ${{ vars.LEAD_SOURCER_ALERT_EMAIL || 'sales@urbanstone.co' }}
      LEAD_SOURCER_EMAIL_FROM: ${{ vars.LEAD_SOURCER_EMAIL_FROM || 'Urban Stone <sales@urbanstone.co>' }}
      LEAD_SOURCER_RUN_REPORT_EMAIL_FROM: ${{ vars.LEAD_SOURCER_EMAIL_FROM || 'Urban Stone <sales@urbanstone.co>' }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      LEAD_WEBHOOK_URL: ${{ secrets.LEAD_WEBHOOK_URL }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      LEAD_SOURCER_REDDIT_USER_AGENT: ${{ vars.LEAD_SOURCER_REDDIT_USER_AGENT }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
      APIFY_NEXTDOOR_TASK_ID: ${{ vars.APIFY_NEXTDOOR_TASK_ID }}
      APIFY_FACEBOOK_TASK_ID: ${{ vars.APIFY_FACEBOOK_TASK_ID }}
      # Facebook Marketplace (logged out; no cookies anywhere). Off until the repo
      # variables APIFY_ENABLE_FB_MARKETPLACE and LEAD_SOURCER_ENABLE_APIFY are "true".
      # Per-run spend caps are passed to Apify on every call (main $0.50, canary $0.05).
      APIFY_ENABLE_FB_MARKETPLACE: ${{ vars.APIFY_ENABLE_FB_MARKETPLACE || 'false' }}
      APIFY_FB_MARKETPLACE_TASK_ID: ${{ vars.APIFY_FB_MARKETPLACE_TASK_ID }}
      APIFY_FB_MARKETPLACE_CANARY_TASK_ID: ${{ vars.APIFY_FB_MARKETPLACE_CANARY_TASK_ID }}
      APIFY_FB_MARKETPLACE_MAX_CHARGE_USD: ${{ vars.APIFY_FB_MARKETPLACE_MAX_CHARGE_USD || '0.50' }}
      APIFY_FB_MARKETPLACE_CANARY_MAX_CHARGE_USD: ${{ vars.APIFY_FB_MARKETPLACE_CANARY_MAX_CHARGE_USD || '0.05' }}
      APIFY_FB_MARKETPLACE_CANARY_MIN_RESULTS: ${{ vars.APIFY_FB_MARKETPLACE_CANARY_MIN_RESULTS || '5' }}
      # Wanted posts relay to sales@ only in live mode (internal-only; relay guard applies).
      APIFY_FB_MARKETPLACE_REVIEW_ONLY: ${{ vars.APIFY_FB_MARKETPLACE_REVIEW_ONLY || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lead-sourcer/package-lock.json
      - run: npm ci

      # Dedup + daily state live on disk; carry them between runs.
      - name: Restore sourcer state
        uses: actions/cache/restore@v4
        with:
          path: |
            lead-sourcer/seen-ids.json
            lead-sourcer/runs
          key: lead-sourcer-state-${{ github.run_id }}
          restore-keys: lead-sourcer-state-

      - name: Check configuration
        run: node scripts/check-config.mjs

      - name: Run lead sourcer
        run: node src/index.js

      - name: Save sourcer state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            lead-sourcer/seen-ids.json
            lead-sourcer/runs
          key: lead-sourcer-state-${{ github.run_id }}

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lead-sourcer-run-${{ github.run_id }}
          path: lead-sourcer/runs/*.jsonl
          if-no-files-found: ignore
          retention-days: 30
